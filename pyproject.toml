[project]
name = "snowwatch"
version = "0.1.0"
description = "Competitive displacement signal monitor for Snowflake"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
snowwatch = "snowwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snowwatch", "snowwatch.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
